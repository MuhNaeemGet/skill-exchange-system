<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Requests — SkillSwap</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div id="toast-wrap"></div>

<div class="wrap page-body">
  <div class="ph"><div><h1>Exchange requests</h1><p>Manage your incoming and outgoing skill exchange requests</p></div></div>

  <div class="tabs">
    <button class="tab on" id="t-recv" onclick="switchTab('recv')">📥 Received</button>
    <button class="tab"    id="t-sent" onclick="switchTab('sent')">📤 Sent</button>
  </div>

  <div id="panel-recv"></div>
  <div id="panel-sent" style="display:none"></div>
</div>

<!-- Schedule Modal -->
<div id="sched-modal" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-hdr"><h3>Schedule a session</h3><button class="modal-x" onclick="closeSched()">✕</button></div>
    <input type="hidden" id="sc-rid">
    <div class="fg"><label>Date &amp; time</label><input type="datetime-local" id="sc-dt"></div>
    <div class="fg-row">
      <div class="fg"><label>Duration (minutes)</label><input type="number" id="sc-dur" value="60" min="15" max="480"></div>
      <div class="fg"><label>Mode</label><select id="sc-mode"><option value="online">Online</option><option value="in-person">In-person</option></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeSched()">Cancel</button>
      <button class="btn btn-primary" onclick="submitSched()">Schedule session →</button>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
requireAuth();
renderNav('request');
const user = getUser();

function switchTab(t) {
  document.getElementById('panel-recv').style.display = t==='recv'?'block':'none';
  document.getElementById('panel-sent').style.display = t==='sent'?'block':'none';
  document.getElementById('t-recv').className = 'tab'+(t==='recv'?' on':'');
  document.getElementById('t-sent').className = 'tab'+(t==='sent'?' on':'');
}

function renderList(list, elId, type) {
  const el = document.getElementById(elId);
  if (!list.length) {
    el.innerHTML = `<div class="empty"><span class="empty-ico">${type==='recv'?'📥':'📤'}</span><p>No ${type==='recv'?'received':'sent'} requests yet.</p></div>`;
    return;
  }
  el.innerHTML = list.map(r=>`
    <div class="item">
      <div class="item-l">
        <div class="item-title">${escHtml(r.requester_name)} → ${escHtml(r.provider_name)}</div>
        <div class="item-sub" style="margin-top:.35rem">
          <span class="badge badge-green">${escHtml(r.skill_offered)}</span>
          <span style="color:var(--ink-4);margin:0 .3rem">↔</span>
          <span class="badge badge-brand">${escHtml(r.skill_wanted)}</span>
        </div>
        ${r.message?`<div style="font-size:13px;color:var(--ink-3);margin-top:.35rem;font-style:italic;padding:.5rem .75rem;background:var(--bg);border-radius:var(--r-xs);border-left:3px solid var(--brand-l)">"${escHtml(r.message)}"</div>`:''}
        <div class="item-meta">
          ${statusBadge(r.status)}
          <span style="font-size:11px;color:var(--ink-4)">🕐 ${fmtDate(r.created_at)}</span>
        </div>
      </div>
      <div class="item-r">
        ${r.status==='pending'&&r.provider_id===user.user_id?`
          <button class="btn btn-success btn-sm" onclick="respond(${r.request_id},'accepted')">✓ Accept</button>
          <button class="btn btn-danger  btn-sm" onclick="respond(${r.request_id},'rejected')">✕ Reject</button>`:''}
        ${r.status==='accepted'?`<button class="btn btn-teal btn-sm" onclick="openSched(${r.request_id})">📅 Schedule</button>`:''}
        ${r.status==='pending'&&r.requester_id===user.user_id?`<button class="btn btn-outline btn-sm" onclick="respond(${r.request_id},'cancelled')">Cancel</button>`:''}
      </div>
    </div>`).join('');
}

async function load() {
  const d = await api('GET','/api/requests');
  const a = d.requests||[];
  renderList(a.filter(r=>r.provider_id ===user.user_id), 'panel-recv','recv');
  renderList(a.filter(r=>r.requester_id===user.user_id), 'panel-sent','sent');
}

async function respond(rid,status) {
  const d = await api('PUT',`/api/requests/${rid}`,{status});
  if (d.error) { toast(d.error,'err'); return; }
  toast(`Request ${status}!`,'ok'); load();
}

function openSched(rid) {
  document.getElementById('sc-rid').value = rid;
  const t = new Date(Date.now()+86400000);
  document.getElementById('sc-dt').value = t.toISOString().slice(0,16);
  document.getElementById('sched-modal').style.display = 'flex';
}
function closeSched() { document.getElementById('sched-modal').style.display = 'none'; }

async function submitSched() {
  const d = await api('POST','/api/sessions',{
    request_id:   parseInt(document.getElementById('sc-rid').value),
    scheduled_at: document.getElementById('sc-dt').value,
    duration_mins: parseInt(document.getElementById('sc-dur').value)||60,
    mode:         document.getElementById('sc-mode').value
  });
  if (d.error) { toast(d.error,'err'); return; }
  toast('Session scheduled! 📅','ok'); closeSched(); load();
}

document.getElementById('sched-modal').addEventListener('click', e => { if (e.target===e.currentTarget) closeSched(); });
load();
</script>
</body>
</html>
