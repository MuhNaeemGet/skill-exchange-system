<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matches — SkillSwap</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div id="toast-wrap"></div>

<div class="wrap page-body">
  <div class="ph">
    <div>
      <h1>Your matches</h1>
      <p>People who offer what you need AND want what you offer — perfect exchanges</p>
    </div>
    <a href="profile.html" class="btn btn-secondary btn-sm">Edit my skills</a>
  </div>

  <div id="tip" class="alert alert-info" style="margin-bottom:1.5rem">
    ℹ Matches are generated from your offered and wanted skills. Add more skills to your profile to find more matches.
  </div>

  <div id="matches-grid" class="grid-3">
    <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink-4)">Loading…</div>
  </div>
</div>

<!-- Request Modal -->
<div id="req-modal" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Exchange with <span id="m-name" style="color:var(--brand)"></span></h3>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="m-provider">
    <div class="fg"><label>Skill I offer</label><select id="m-offer"></select></div>
    <div class="fg"><label>Skill I want to learn</label><select id="m-want"></select></div>
    <div class="fg">
      <label>Message <span style="color:var(--ink-4);font-weight:400;font-size:12px">(optional)</span></label>
      <textarea id="m-msg" placeholder="Hi! I'd love to exchange skills…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="sendReq()">Send request →</button>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
requireAuth();
renderNav('users');
const user = getUser();

async function loadMatches() {
  const d    = await api('GET','/api/matches');
  const grid = document.getElementById('matches-grid');
  const m    = d.matches||[];

  if (!m.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="empty"><span class="empty-ico">🤝</span><p>No matches yet.<br>Add more skills to your <a href="profile.html">profile</a> to find matches.</p></div>`;
    return;
  }
  grid.innerHTML = m.map(u=>`
    <div class="user-card">
      <div class="uc-head">
        <div class="av av-md">${initials(u.username)}</div>
        <div class="uc-info">
          <h4>${escHtml(u.username)}</h4>
          <p>📍 ${escHtml(u.location||'Location not set')}</p>
          <div class="stars">${starStr(u.avg_rating)}</div>
        </div>
      </div>
      <div class="uc-pills">
        <span class="badge badge-green">Offers: ${escHtml(u.they_offer)}</span>
        <span class="badge badge-amber">Wants: ${escHtml(u.they_want)}</span>
      </div>
      <p class="uc-bio">${escHtml(u.bio||'No bio yet.')}</p>
      <div class="uc-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal(${u.user_id},'${escHtml(u.username).replace(/'/g,"\\'")}')">Exchange →</button>
      </div>
    </div>`).join('');
}

async function openModal(pid, pname) {
  document.getElementById('m-name').textContent = pname;
  document.getElementById('m-provider').value   = pid;
  document.getElementById('m-msg').value        = '';
  const [my, their] = await Promise.all([api('GET',`/api/users/${user.user_id}`), api('GET',`/api/users/${pid}`)]);
  const myOff  = (my.skills   ||[]).filter(s=>s.type==='offer');
  const thOf   = (their.skills||[]).filter(s=>s.type==='offer');
  document.getElementById('m-offer').innerHTML = myOff.length ? myOff.map(s=>`<option value="${s.skill_id}">${escHtml(s.name)}</option>`).join('') : '<option>— Add offered skills first —</option>';
  document.getElementById('m-want').innerHTML  = thOf.length  ? thOf.map(s=> `<option value="${s.skill_id}">${escHtml(s.name)}</option>`).join('') : '<option>— No offered skills —</option>';
  document.getElementById('req-modal').style.display = 'flex';
}
function closeModal() { document.getElementById('req-modal').style.display = 'none'; }
async function sendReq() {
  const d = await api('POST','/api/requests',{
    provider_id:      parseInt(document.getElementById('m-provider').value),
    skill_offered_id: parseInt(document.getElementById('m-offer').value),
    skill_wanted_id:  parseInt(document.getElementById('m-want').value),
    message:          document.getElementById('m-msg').value
  });
  if (d.error) { toast(d.error,'err'); return; }
  toast('Request sent! 🎉','ok'); closeModal();
}
document.getElementById('req-modal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
loadMatches();
</script>
</body>
</html>
