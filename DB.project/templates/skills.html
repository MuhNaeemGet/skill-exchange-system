<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Skills — SkillSwap</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div id="toast-wrap"></div>

<div class="wrap page-body">
  <div class="ph">
    <div><h1>Browse skills</h1><p>Find people ready to teach what you want to learn</p></div>
  </div>

  <div class="search-bar">
    <span style="font-size:18px;color:var(--ink-4)">🔍</span>
    <input type="text" id="q-skill" placeholder="Search by skill name…" onkeydown="if(event.key==='Enter')loadUsers()">
    <select id="q-cat">
      <option value="">All categories</option>
      <option>Tech</option><option>Art</option><option>Music</option>
      <option>Language</option><option>Education</option>
      <option>Sports</option><option>Lifestyle</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="loadUsers()">Search</button>
  </div>

  <div id="users-grid" class="grid-3">
    <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink-4)">Loading…</div>
  </div>
</div>

<!-- Request Modal -->
<div id="req-modal" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Send request to <span id="m-name" style="color:var(--brand)"></span></h3>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="m-provider">
    <div class="fg">
      <label>Skill I offer in exchange</label>
      <select id="m-offer"></select>
    </div>
    <div class="fg">
      <label>Skill I want to learn from them</label>
      <select id="m-want"></select>
    </div>
    <div class="fg">
      <label>Message <span style="color:var(--ink-4);font-weight:400;font-size:12px">(optional)</span></label>
      <textarea id="m-msg" placeholder="Hi! I'd love to exchange skills with you…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="sendReq()">Send request →</button>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
requireAuth();
renderNav('skills');
const user = getUser();

async function loadUsers() {
  const skill = document.getElementById('q-skill').value.trim();
  const cat   = document.getElementById('q-cat').value;
  const p     = new URLSearchParams();
  if (skill) p.set('skill', skill);
  if (cat)   p.set('category', cat);
  const grid = document.getElementById('users-grid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink-4)">Searching…</div>';

  const d = await api('GET', '/api/browse?' + p);
  if (d.error) { grid.innerHTML = `<div style="grid-column:1/-1" class="empty"><span class="empty-ico">⚠️</span><p>${escHtml(d.error)}</p></div>`; return; }

  const users = d.users || [];
  if (!users.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="empty"><span class="empty-ico">🔍</span><p>No users found.<br>Try a different skill or category.</p></div>`;
    return;
  }
  grid.innerHTML = users.map(u => `
    <div class="user-card">
      <div class="uc-head">
        <div class="av av-md">${initials(u.username)}</div>
        <div class="uc-info">
          <h4>${escHtml(u.username)}</h4>
          <p>📍 ${escHtml(u.location||'Location not set')}</p>
          <div class="stars">${starStr(u.avg_rating)}</div>
        </div>
      </div>
      <div class="uc-pills">
        <span class="badge badge-green">Offers: ${escHtml(u.skill_name)}</span>
        <span class="badge badge-gray">${escHtml(u.level)}</span>
        <span class="badge badge-brand">${u.hourly_credits} cr/hr</span>
      </div>
      <p class="uc-bio">${escHtml(u.bio||'No bio yet.')}</p>
      <div class="uc-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal(${u.user_id},'${escHtml(u.username).replace(/'/g,"\\'")}')">Send request</button>
      </div>
    </div>`).join('');
}

async function openModal(pid, pname) {
  document.getElementById('m-name').textContent    = pname;
  document.getElementById('m-provider').value      = pid;
  document.getElementById('m-msg').value           = '';

  const [my, their] = await Promise.all([
    api('GET',`/api/users/${user.user_id}`),
    api('GET',`/api/users/${pid}`)
  ]);
  const myOff   = (my.skills   ||[]).filter(s=>s.type==='offer');
  const theirOf = (their.skills||[]).filter(s=>s.type==='offer');

  document.getElementById('m-offer').innerHTML = myOff.length
    ? myOff.map(s=>`<option value="${s.skill_id}">${escHtml(s.name)} (${s.level})</option>`).join('')
    : '<option value="">— Add skills to your profile first —</option>';
  document.getElementById('m-want').innerHTML = theirOf.length
    ? theirOf.map(s=>`<option value="${s.skill_id}">${escHtml(s.name)}</option>`).join('')
    : '<option value="">— This user has no offered skills —</option>';

  document.getElementById('req-modal').style.display = 'flex';
}

function closeModal() { document.getElementById('req-modal').style.display = 'none'; }

async function sendReq() {
  const pid  = parseInt(document.getElementById('m-provider').value);
  const off  = parseInt(document.getElementById('m-offer').value);
  const want = parseInt(document.getElementById('m-want').value);
  const msg  = document.getElementById('m-msg').value;
  if (!pid||!off||!want) { toast('Please select skills first','err'); return; }

  const d = await api('POST','/api/requests',{provider_id:pid,skill_offered_id:off,skill_wanted_id:want,message:msg});
  if (d.error) { toast(d.error,'err'); return; }
  toast('Request sent successfully! 🎉','ok');
  closeModal();
}

document.getElementById('req-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
loadUsers();
</script>
</body>
</html>
