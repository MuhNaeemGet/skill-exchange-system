{% extends "layout.html" %}
{% block title %}Login — SkillPortal{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">SP</span>
    </div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to your SkillPortal account</p>

    <div class="role-toggle" id="roleToggle">
      <button type="button" class="role-btn active" data-role="student">Student</button>
      <button type="button" class="role-btn" data-role="teacher">Teacher</button>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <input type="hidden" name="role" id="roleInput" value="student" />

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="demo-creds">
      <p class="demo-title">Demo Credentials</p>
      <div class="demo-grid">
        <div>
          <strong>Student</strong><br/>
          ahmed@example.com<br/>
          <code>student123</code>
        </div>
        <div>
          <strong>Teacher</strong><br/>
          sarah@example.com<br/>
          <code>teacher123</code>
        </div>
      </div>
    </div>

    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>

<script>
const roleBtns  = document.querySelectorAll('.role-btn');
const roleInput = document.getElementById('roleInput');
roleBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    roleBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    roleInput.value = btn.dataset.role;
  });
});
</script>
{% endblock %}
