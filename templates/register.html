{% extends "layout.html" %}
{% block title %}Register — SkillPortal{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">SP</span>
    </div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join the SkillPortal community today</p>

    <!-- Role Toggle -->
    <div class="role-toggle" id="roleToggle">
      <button type="button" class="role-btn active" data-role="student">Student</button>
      <button type="button" class="role-btn" data-role="teacher">Teacher</button>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="registerForm">
      <input type="hidden" name="role" id="roleInput" value="student" />

      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
      </div>

      <!-- Teacher-only fields -->
      <div id="teacherFields" style="display:none;">
        <div class="form-group">
          <label for="bio">Short Bio</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Tell students about yourself…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="experience">Experience (years)</label>
            <input type="number" id="experience" name="experience" placeholder="e.g. 5" min="0" />
          </div>
          <div class="form-group">
            <label for="hourly_rate">Hourly Rate ($)</label>
            <input type="number" id="hourly_rate" name="hourly_rate" placeholder="e.g. 25" min="0" step="0.5" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</section>

<script>
const roleBtns    = document.querySelectorAll('.role-btn');
const roleInput   = document.getElementById('roleInput');
const teacherFlds = document.getElementById('teacherFields');

roleBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    roleBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    roleInput.value = btn.dataset.role;
    teacherFlds.style.display = btn.dataset.role === 'teacher' ? 'block' : 'none';
  });
});
</script>
{% endblock %}
