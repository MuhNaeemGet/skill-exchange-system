{% extends "layout.html" %}
{% block title %}Admin Login — SkillPortal{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card admin-auth">

    <div class="auth-logo admin-badge">🛡</div>
    <h1 class="auth-title">Admin Portal</h1>
    <p class="auth-sub">Secure administrative access</p>

    <form method="POST" action="{{ url_for('admin_login') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Admin username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Admin password" required />
      </div>
      <button type="submit" class="btn btn-danger btn-block">Login as Admin</button>
    </form>


    <p class="auth-switch"><a href="{{ url_for('index') }}">← Back to Home</a></p>
  </div>
</section>
{% endblock %}
